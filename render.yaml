services:
  - type: web
    name: siqa-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn servidor:app
    envVars:
      - key: DATABASE_URL
        sync: false

  # O coletor MQTT fica separado da API. Se você tiver um plano Render
  # que permita Background Worker, pode publicar este serviço também.
  - type: worker
    name: siqa-mqtt
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python ingestao_mqtt.py
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: MQTT_HOST
        value: broker.hivemq.com
      - key: MQTT_PORT
        value: "1883"
      - key: MQTT_TOPIC
        value: projeto/medidor/potencia
