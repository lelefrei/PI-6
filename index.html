<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tô Ligado! - Painel de Controle</title>
  <link rel="stylesheet" href="style.css" />
  
  <!-- Biblioteca Chart.js para renderização dos gráficos -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
  <header>
    <div class="logo">
      <img src="icone-projeto-integrador.jpg" alt="Logo Tô Ligado" />
      <h1>Tô Ligado!</h1>
    </div>
    <nav>
      <ul>
        <li><a href="#dispositivos">Dispositivos</a></li>
        <li><a href="#graficos">Gráficos</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <!-- Seção de Cartões dos Dispositivos -->
    <section id="dispositivos" class="card">
      <h2>Status dos Dispositivos</h2>
      <div id="lista-dispositivos" class="grid-dispositivos">
        <!-- Dispositivos carregados dinamicamente pelo JS -->
      </div>
    </section>

    <!-- Nova Seção com os Gráficos do Supabase -->
    <section id="graficos" class="card">
      <h2>Consumo Energético</h2>
      
      <div class="grid-graficos">
        <!-- Gráfico 1: Consumo por Dispositivo -->
        <div class="card-grafico">
          <h3>Consumo Total por Dispositivo (kWh)</h3>
          <canvas id="graficoDispositivos"></canvas>
        </div>

        <!-- Gráfico 2: Histórico de Consumo -->
        <div class="card-grafico">
          <h3>Evolução do Consumo no Tempo</h3>
          <canvas id="graficoHistorico"></canvas>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 - Projeto Integrador VI (PI6)</p>
  </footer>

  <script src="app.js"></script>
</body>
</html>
